spring.application.name=Payment Service

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payment_service_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_HBM2DDL:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.use_sql_comments=${JPA_SQL_COMMENTS:true}

# Active Profile
spring.profiles.active=${SPRING_PROFILE:dev}

# RabbitMQ Connection
spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}

# Publisher confirms + returns: the outbox relay only marks a row sent once
# the broker acked it and it was routable (contract §1)
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
messaging.publish-timeout-ms=${RABBITMQ_PUBLISH_TIMEOUT_MS:10000}

# Consumer: manual ack after processing (contract §1, §4.1).
# Exchange/queue names are fixed by MESSAGING-CONTRACT.md, see MessagingConstants.
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=${RABBITMQ_PREFETCH:10}
spring.rabbitmq.listener.simple.default-requeue-rejected=true
# contract values are 5s/30s/2m - only override against a throw-away broker
messaging.retry-delays-ms=${RABBITMQ_RETRY_DELAYS_MS:5000,30000,120000}

spring.jackson.serialization.write-dates-as-timestamps=false

# Outbox relay (contract §7)
messaging.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:1000}
messaging.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
