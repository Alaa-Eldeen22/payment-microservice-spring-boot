spring.application.name=Payment Service

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payment_service_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_HBM2DDL:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.use_sql_comments=${JPA_SQL_COMMENTS:true}

# Active Profile
spring.profiles.active=${SPRING_PROFILE:dev}

# RabbitMQ Connection
spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}

# RabbitMQ Configuration
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.jackson.serialization.write-dates-as-timestamps=false

# RabbitMQ Queues
invoice.queue=${INVOICE_QUEUE:invoice_events}
payment.queue=${PAYMENT_QUEUE:payment_events}

# RabbitMQ Exchange
invoice.exchange=${INVOICE_EXCHANGE:invoice_events}

# Invoice Event Routing Keys
invoice.routing.created=${INVOICE_CREATED_ROUTING_KEY:invoice.created}
invoice.routing.retry=${INVOICE_RETRIED_ROUTING_KEY:invoice.retried}

# Payment Event Routing Keys
payment.routing.authorized=${PAYMENT_AUTHORIZED_ROUTING_KEY:payment.authorized}
payment.routing.failed=${PAYMENT_FAILED_ROUTING_KEY:payment.failed}
payment.routing.captured=${PAYMENT_CAPTURED_ROUTING_KEY:payment.captured}
payment.routing.voided=${PAYMENT_VOIDED_ROUTING_KEY:payment.voided}
